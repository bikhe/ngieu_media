
services:
  db:
    image: postgis/postgis:15-3.3-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-events_db}
      POSTGRES_USER: ${DB_USER:-events_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Set-Your-Password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend/api
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend/api:/app
    depends_on:
      - db
      - redis
    env_file:
      - ./backend/api/.env
    # We use runserver for local test runs so that Django serves static admin files
    # automatically, and prints debug logs.
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  bot:
    build:
      context: ./backend/api
    restart: always
    volumes:
      - ./backend/api:/app
    depends_on:
      - db
      - backend
    env_file:
      - ./backend/api/.env
    command: python manage.py run_bot

  frontend:
    build:
      context: ./frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    env_file:
      - ./frontend/.env

  update-broker:
    build:
      context: ./backend/update-broker
    restart: always
    ports:
      - "8001:8001"
    volumes:
      - ./backend/update-broker:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8001 --reload
    depends_on:
      - redis
      - backend

  celery_worker:
    build:
      context: ./backend/api
    restart: always
    volumes:
      - ./backend/api:/app
    depends_on:
      - db
      - redis
    env_file:
      - ./backend/api/.env
    command: celery -A core worker -l info

volumes:
  postgres_data:
