version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-events_db}
      POSTGRES_USER: ${DB_USER:-events_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Port 5432 is not exposed for security in production

  redis:
    image: redis:7-alpine
    restart: always

  backend:
    build:
      context: ./backend/api
    restart: always
    depends_on:
      - db
      - redis
    env_file:
      - ./backend/api/.env
    volumes:
      - django_static:/app/staticfiles
      - django_media:/app/media
    # In production, we run the default CMD (gunicorn) instead of python manage.py runserver.
    # We also apply migrations before starting.
    command: >
      sh -c "python manage.py migrate &&
             gunicorn --bind 0.0.0.0:8000 --workers 3 core.wsgi:application"

  bot:
    build:
      context: ./backend/api
    restart: always
    depends_on:
      - db
      - backend
    env_file:
      - ./backend/api/.env
    command: python manage.py run_bot

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-https://api.pivas.su/api}
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - update-broker
    volumes:
      - django_static:/usr/share/nginx/html/django_static:ro
      - django_media:/usr/share/nginx/html/django_media:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/lib/letsencrypt:/var/lib/letsencrypt:ro

  update-broker:
    build:
      context: ./backend/update-broker
    restart: always
    depends_on:
      - redis
      - backend

  meilisearch:
    image: getmeili/meilisearch:v1.12
    restart: always
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-dev_master_key}
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meili_data:/meili_data
    # Not exposing port 7700 publicly, must be proxied via nginx or used by backend

  celery_worker:
    build:
      context: ./backend/api
    restart: always
    depends_on:
      - db
      - redis
    env_file:
      - ./backend/api/.env
    command: celery -A core worker -l info

  prometheus:
    image: prom/prometheus:latest
    restart: always
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090" # Bind to localhost for security

  grafana:
    image: grafana/grafana:latest
    restart: always
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  django_static:
  django_media:
  meili_data:
  prometheus_data:
  grafana_data:
