server {
    listen 80;
    server_name admin.pivas.su mobile.pivas.su api.pivas.su;
    
    # Let's Encrypt challenge path (if needed for future renewals)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name admin.pivas.su mobile.pivas.su;

    ssl_certificate /etc/letsencrypt/live/admin.pivas.su/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.pivas.su/privkey.pem;

    # SSL optimization
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        root /usr/share/nginx/html/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    server_name api.pivas.su;

    ssl_certificate /etc/letsencrypt/live/admin.pivas.su/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.pivas.su/privkey.pem;

    # SSL optimization
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Django static files
    location /static/ {
        alias /usr/share/nginx/html/django_static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Django uploaded media files
    location /media/ {
        alias /usr/share/nginx/html/django_media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Update broker SSE endpoint
    location /api/updates/stream {
        proxy_pass http://update-broker:8001/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
    }

    # Django backend API and Admin
    location / {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Support websockets / SSE
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}
